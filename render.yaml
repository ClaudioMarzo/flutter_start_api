services:
  - type: web
    name: flutterstart-api
    env: docker
    buildCommand: docker build -t flutterstart-api .
    startCommand: docker run -p 8080:8080 flutterstart-api
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: PORT
        value: 8080
      # # Add your database connection string here
      # - key: ConnectionStrings__ProductionConnection
      #   sync: false